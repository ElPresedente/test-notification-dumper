name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - name: Build APK and run Android Lint
        run: bash ./gradlew --no-daemon --console=plain assembleDebug lintDebug
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/notification-dumper.apk
          cd dist
          sha256sum notification-dumper.apk > SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: notification-dumper-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
